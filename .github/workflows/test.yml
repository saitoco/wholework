name: Test

on:
  push:
  pull_request:

jobs:
  bats:
    name: Run bats tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm packages for smoke tests
        run: npm install --no-save sharp pixelmatch

      - name: Install bats
        run: |
          sudo apt-get update -q
          sudo apt-get install -y bats

      - name: Prepare bats run-log directory
        run: mkdir -p tests/.bats/run-logs

      - name: Run bats tests
        id: bats
        continue-on-error: true
        run: bats --jobs $(nproc) tests/

      - name: Re-run parallel-only failures serially
        if: steps.bats.outcome == 'failure'
        run: |
          echo "## Serial re-run of tests that failed under parallel execution" >> "$GITHUB_STEP_SUMMARY"
          bats --filter-status failed tests/ | tee -a "$GITHUB_STEP_SUMMARY"

  validate-syntax:
    name: Validate skill syntax
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate skill syntax
        run: python3 scripts/validate-skill-syntax.py skills/

      - name: Detect residual watchdog-reconcile references
        run: |
          if grep -r watchdog-reconcile scripts/; then
            echo "Residual watchdog-reconcile reference found in scripts/"; exit 1
          fi

  check-forbidden-expressions:
    name: Forbidden Expressions check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for forbidden expressions
        run: bash scripts/check-forbidden-expressions.sh

  check-config-schema:
    name: Config Schema check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check .wholework.yml for unknown/typo keys
        run: bash scripts/check-config-schema.sh

  bare-bracket-assertions:
    name: Bare Bracket Assertions check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Diagnose bash bare [[ ]] set -e propagation
        run: |
          bash --version
          if bash -c 'set -e; [[ "1" == "2" ]]; echo UNREACHABLE'; then
            echo "REPRO-CHECK: bare [[ ]] failure did NOT propagate through set -e (issue #1412 bug reproduced on this runner)"
          else
            echo "REPRO-CHECK: bare [[ ]] failure propagated through set -e correctly (issue #1412 bug not reproduced on this runner)"
          fi

      - name: Check for bare bracket assertions
        run: bash scripts/check-bare-bracket-assertions.sh

  language-convention:
    name: Language Convention check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check language convention
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff "origin/${{ github.base_ref }}...HEAD" -- skills/ modules/ scripts/ | python3 scripts/check-language-convention.py
          else
            git diff "HEAD^..HEAD" -- skills/ modules/ scripts/ | python3 scripts/check-language-convention.py
          fi

  macos-shell:
    name: macOS shell compatibility
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run shell scripts on macOS
        run: |
          for f in scripts/*.sh; do
            bash -n "$f"
          done
