opportunistic-verify: true
skill-proposals: true
session-auto-rename: true
autonomy: L3
verify-max-iterations: 3
# #1163 系 (manual AC 再型付け) は 1 フェーズで 29 Issue 分の L0 変更を行うため、
# code フェーズ既定 4680s (scripts/watchdog-defaults.sh) では不足しうる。
watchdog-timeout-code-seconds: 7200
# Size L の `/review --full` は fan-out (review-spec + review-bug x2) と 2 段階検証を
# 直列に回すため、既定 2600s (scripts/watchdog-defaults.sh) では PR #1201 で kill された。
watchdog-timeout-review-seconds: 5400
# spec フェーズの watchdog 上限は、#1301 の project override (2340s) が 3 セッション連続で
# 余裕 60-280s まで詰まったため、#1509 で global default (scripts/watchdog-defaults.sh の
# WATCHDOG_TIMEOUT_SPEC_DEFAULT = 2964s) へ昇格した。この repo では override を置かない。
# 根拠と実測は docs/tech.md の Watchdog timeout calibration を参照。
auto-retry-on-fail:
  enabled: true
  threshold: 3
# #1179 により既定 opt-out。頻度確認は `bash scripts/collect-recovery-candidates.sh docs/reports/orchestration-recoveries.md --threshold 1`
recoveries-auto-fire:
  enabled: false
capabilities:
  workflow: true
themes:
  observability: "Theme: observability — detection without persistence, logging gaps"
  ac-quality: "Theme: acceptance criteria / verify command quality"
  concurrency: "Theme: concurrent session conflicts, session_id misattribution"
  verify-backlog: "Theme: post-merge verify backlog accumulation"
  batch-orchestration: "Theme: batch/until orchestration — backlog resolution, round ordering, safety valves"
